[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"app/pages/*.py" = ["N999"]  # Streamlit pages must start with numbers
"app/ml/train.py" = ["E402", "N806"]  # sys.path setup needed; X/y sklearn convention
"tests/test_train.py" = ["E402"]  # sys.path setup needed for test imports

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: unit tests",
    "slow: slow running tests",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "app/pages/*", "app/ml/model/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
