name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        run: |
          set -eo pipefail

          mkdir -p ~/.ssh

          # Write key from secret (preserve trailing newline - required by OpenSSH)
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Debug: verify key file
          echo ">> Key file size: $(wc -c < ~/.ssh/deploy_key) bytes"
          echo ">> Key file lines: $(wc -l < ~/.ssh/deploy_key)"
          head -1 ~/.ssh/deploy_key | sed 's/./*/g'
          tail -1 ~/.ssh/deploy_key | sed 's/./*/g'

          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # Show key fingerprint for comparison
          echo ">> Deploy key fingerprint:"
          ssh-keygen -lf ~/.ssh/deploy_key 2>&1

          echo ">> Testing SSH connection with verbose output..."
          ssh -v -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o PasswordAuthentication=no \
              -o IdentitiesOnly=yes \
              -o ConnectTimeout=10 \
              "${SSH_USER}@${SSH_HOST}" "echo SSH_OK" 2>&1 | grep -E "Offering|accepts|Authenticated|Permission|identity|remote software|Will attempt|Server accepts|debug1: Next" | head -10

          echo ""
          echo ">> Server host key fingerprint:"
          ssh-keyscan -t ed25519 "${SSH_HOST}" 2>/dev/null | ssh-keygen -lf - 2>&1

          # ── 1. Clone or pull repo ──
          DEPLOY_DIR="/opt/banksys"
          REPO_URL="git@github.com:thiyfrxd-cyber/banksys_sy_cuibowen.git"

          echo ">> Connecting to server..."
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o PasswordAuthentication=no \
              -o IdentitiesOnly=yes \
              "${SSH_USER}@${SSH_HOST}" "
            set -e
            if [ -d '$DEPLOY_DIR/.git' ]; then
              echo '>> Pulling latest code...'
              cd '$DEPLOY_DIR'
              git config --global --add safe.directory '$DEPLOY_DIR'
              git pull origin main
            else
              echo '>> Cloning repository...'
              rm -rf '$DEPLOY_DIR'
              git clone '$REPO_URL' '$DEPLOY_DIR'
            fi
          "

          # ── 2. Docker build and deploy ──
          echo ">> Building and deploying..."
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o PasswordAuthentication=no \
              -o IdentitiesOnly=yes \
              "${SSH_USER}@${SSH_HOST}" "
            set -e
            cd '$DEPLOY_DIR'

            # Stop old container + clean up anything on port 8888
            docker rm -f banksys_sy_cuibowen 2>/dev/null || true
            HOST_PORT=8888

            echo \">> Deploying to host port \$HOST_PORT\"

            # Build and launch
            docker build \
              --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple \
              -t banksys_sy_cuibowen:latest \
              .

            docker run -d \
              --name banksys_sy_cuibowen \
              --restart unless-stopped \
              -p \${HOST_PORT}:8501 \
              banksys_sy_cuibowen:latest

            # Health check
            sleep 5
            for i in 1 2 3 4 5 6; do
              if curl -fsS http://localhost:\${HOST_PORT}/_stcore/health; then
                echo \">> Deploy SUCCESS: http://${SSH_HOST}:\${HOST_PORT}\"
                exit 0
              fi
              echo \">> Health check attempt \$i/6 failed, retrying...\"
              sleep 5
            done
            echo '>> Health check FAILED after 6 attempts'
            exit 1
          "

          echo ">> CD completed"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
