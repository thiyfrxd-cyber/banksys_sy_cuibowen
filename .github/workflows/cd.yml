name: CD

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        run: |
          set -eo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          # ── 1. Clone or pull repo ──
          DEPLOY_DIR="/opt/banksys"
          REPO_URL="git@github.com:thiyfrxd-cyber/banksys_sy_cuibowen.git"

          echo ">> Connecting to server..."
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o PasswordAuthentication=no \
              -o IdentitiesOnly=yes \
              "${SSH_USER}@${SSH_HOST}" "
            set -e
            if [ -d '$DEPLOY_DIR/.git' ]; then
              echo '>> Pulling latest code...'
              cd '$DEPLOY_DIR'
              git config --global --add safe.directory '$DEPLOY_DIR'
              git pull origin main
            else
              echo '>> Cloning repository...'
              rm -rf '$DEPLOY_DIR'
              git clone '$REPO_URL' '$DEPLOY_DIR'
            fi
          "

          # ── 2. Docker build and deploy ──
          echo ">> Building and deploying..."
          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=accept-new \
              -o PasswordAuthentication=no \
              -o IdentitiesOnly=yes \
              "${SSH_USER}@${SSH_HOST}" "
            set -e
            cd '$DEPLOY_DIR'

            # Remove all old containers on target ports
            for p in 8888 8889 8890 8891 8892 8893 8894; do
              cid=\$(docker ps -q --filter "publish=\$p" 2>/dev/null)
              [ -n \"\$cid\" ] && docker rm -f \$cid 2>/dev/null || true
            done
            docker rm -f banksys_sy_cuibowen 2>/dev/null || true
            sleep 1

            # Build image
            echo '>> Building Docker image...'
            docker build \
              --build-arg PIP_INDEX_URL=https://pypi.tuna.tsinghua.edu.cn/simple \
              -t banksys_sy_cuibowen:latest \
              .

            # Launch with port fallback
            echo '>> Starting container...'
            for HOST_PORT in 8888 8889 8890 8891 8892 8893 8894; do
              if docker run -d \
                  --name banksys_sy_cuibowen \
                  --restart unless-stopped \
                  -p \${HOST_PORT}:8501 \
                  banksys_sy_cuibowen:latest 2>/dev/null; then
                echo \">> Container started on port \$HOST_PORT\"
                break
              fi
              docker rm -f banksys_sy_cuibowen 2>/dev/null || true
              [ \"\$HOST_PORT\" = \"8894\" ] && { echo '>> All ports 8888-8894 occupied'; exit 1; }
              echo \">> Port \$HOST_PORT occupied, trying next...\"
            done

            # Health check
            sleep 5
            for i in 1 2 3 4 5 6; do
              if curl -fsS http://localhost:\${HOST_PORT}/_stcore/health; then
                echo \">> Deploy SUCCESS: http://${SSH_HOST}:\${HOST_PORT}\"
                exit 0
              fi
              echo \">> Health check attempt \$i/6 failed, retrying...\"
              sleep 5
            done
            echo '>> Health check FAILED after 6 attempts'
            exit 1
          "

          echo ">> CD completed"
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
